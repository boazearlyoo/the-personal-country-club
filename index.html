const resumeSeed={"profile":{"name":"Boaz Earl Yoo","intro":"Duke student, creator, and sports fan. Explore the people, projects, and places that make up my story—on the course and off."},"holes":[{"title":"Science Academy","subtitle":"Where my story began","body":"THE SCIENCE ACADEMY STEM MAGNET\nNorth Hollywood, CA · August 2018 – June 2025\n\nI spent all my school years at Science Academy and graduated as valedictorian.\n\n4.0 unweighted GPA · 4.7 weighted GPA\nACT: 34/36 · 13 AP courses\n\nOn campus, I was a varsity football quarterback and captain, head varsity basketball manager, AAPI Club president, head school tour administrator, Sustainable Fashion Club president, Environment Club vice president, and flag football offensive coordinator.\n\nClick the school to step inside my memory room."},{"title":"Duke University","subtitle":"Learning, creating, and finding my people","body":"DUKE UNIVERSITY\nDurham, NC · August 2025 – May 2029 (expected)\n\nStudying economics and political science (international relations), with a Markets & Management certificate. GPA: 3.7/4.0.\n\nMy campus life includes CreatorLab, Duke Sports Business Conference, Temptasians Acapella, KAjok, Club Golf, Ballislive, TEA @ Duke, and Roundnet Club. I also serve as a Duke Athletics Communications Assistant, Sports Club Supervisor, and F2T Orientation Leader.\n\nStep inside the Chapel-inspired room to explore my Duke chapter."},{"title":"Experience","subtitle":"From the lab to the sidelines","body":"DUKE TRUEBLUETV · CONTENT DIRECTOR\nOctober 2025 – Present · Durham, NC\nDirected and filmed 50+ videos across five underrepresented sports, helping build NIL brands for 30+ student-athletes. Developed content strategy and edited videos that drove 1M+ views and 3,000 new followers.\n\nABOUT TIME CAFÉ · BARISTA & MARKETING STRATEGIST\nFebruary 2025 – Present · Los Angeles, CA\nCreated a Labubu-inspired marketing campaign that doubled sales within two months. Worked late shifts until 2 AM at a café serving 1,000–1,500 customers daily.\n\nAK LEARNING CENTER · HEAD TUTOR & SPECIAL NEEDS STUDENTS COORDINATOR\nSeptember 2024 – June 2025 · Los Angeles, CA\nTutored subjects from mathematics to history, communicated with parents, and coordinated individualized support and activities for nine special-needs students.\n\nUCLA SAMUELI · LABORATORY INTERN\nJune – November 2024 · Los Angeles, CA\nWorked in the Ab Initio Simulations Laboratory under Dr. Amartya Banerjee, using MATLAB and density functional theory to model electron density and explore potential silicon alternatives for semiconductors."},{"title":"Projects & creation","subtitle":"Ideas into something people can see","body":"ATHLETE STORYTELLING\nAt Duke TrueBlueTV, I direct, film, and edit sports content that puts underrepresented teams and student-athletes in the spotlight: 50+ videos, five sports, and 30+ athlete brands.\n\nCREATORLAB\nI produce and edit Instagram Reels and TikToks and appear as on-screen talent. My CreatorLab work has earned 1M+ views.\n\nCAFÉ MARKETING\nAt About Time Café, I developed a campaign around the Labubu trend that doubled sales within two months.\n\nCOMPUTATIONAL MATERIALS RESEARCH\nAt UCLA’s Ab Initio Simulations Laboratory, I used MATLAB to model electron density and analyze materials as potential alternatives to silicon."},{"title":"Leadership & service","subtitle":"Building something with other people","body":"DREAM TREE YOUTH LEADERS FOUNDATION\nCo-Founder, President & Board Member · April 2020 – Present\nManaged a 74-member organization supporting local initiatives. Led fundraising that raised over $45,000 annually from 2021–2025 and international shoe drives that collected 24,000 pairs for 25 underserved countries. The organization’s work contributed over 55,000 cumulative volunteer hours.\n\nDUKE CREATORLAB\nRecruitment Coordinator & Co-Class President · September 2025 – Present\nCoordinated recruitment engaging 110+ prospective members, with application prompts and events.\n\nDUKE SPORTS BUSINESS CONFERENCE\nProgramming Coordinator · October 2025 – Present\nHelped plan a conference connecting 1,000+ students with sports industry professionals. Scheduled 15+ speakers and coordinated programming and event logistics for DSBC Spring 2026.\n\nDUKEENGAGE: KOREA\nEnglish Second Language Teacher · June – August 2026\nTaught students ages 6–45, supporting 200+ immigrants and refugees. Adapted lessons across three schools during an eight-week program."},{"title":"Skills & recognition","subtitle":"What’s in my bag","body":"LANGUAGES\nKorean · Spanish · Chinese\n\nCREATIVE & TECHNICAL\nActing · Premiere Pro · Content creation\nMATLAB experience through computational materials research\n\nCERTIFICATION\nGeorgetown Certificate: Entrepreneurship & International Relations\n\nRECOGNITION\nFootball National Team of Distinction\nUSA Archery U21: ranked #24\nCongressional Award Gold Medal\nSix-time President’s Volunteer Service Award Gold recipient"},{"title":"Life off the course","subtitle":"The things I make time for","body":"SPORTS\nGolf, basketball, football, and the Dodgers. At Duke, I’m involved in Club Golf and Roundnet Club.\n\nCREATIVE LIFE\nContent creation, acting, and undergraduate life with Temptasians Acapella.\n\nA GOOD DAY OFF\nUnderground rap, gaming, cooking, thrifting, latte art, Beli, and keeping up with WHOOP.\n\nThere’s more to the story than a résumé. This is where those stories will go."},{"title":"Adventures","subtitle":"Learning beyond familiar places","body":"DUKEENGAGE: KOREA\nJune – August 2026\n\nI spent eight weeks teaching English to students ages 6–45 from diverse backgrounds. The program supported 200+ immigrants and refugees in their social adjustment.\n\nAcross three schools, I planned and adapted lessons to different student levels and the program’s timeline.\n\nFROM LOS ANGELES TO DURHAM\nScience Academy and work in Los Angeles shaped my school years. Duke University is where my next chapter is unfolding."},{"title":"Say hello","subtitle":"There’s always another round","body":"I’m Boaz Earl Yoo—a Duke student whose interests span economics, international relations, sports, content creation, and community work.\n\nIf you’d like to talk about a project, an opportunity, or a round of golf, I’d love to hear from you.\n\nboaz.yoo@duke.edu"}],"spots":{"0:lab":{"title":"A STEM foundation","body":"Science Academy was home from August 2018 through June 2025.\n\nI graduated as valedictorian with a 4.0 unweighted GPA and 4.7 weighted GPA, took 13 AP courses, and scored 34/36 on the ACT.\n\nThis spot is ready for the experiments, teachers, and classes I want to remember."},"0:projects":{"title":"From school to a research lab","body":"During my Science Academy years, I interned at UCLA Samueli’s Ab Initio Simulations Laboratory (June–November 2024).\n\nUnder Dr. Amartya Banerjee, I used MATLAB to model electron density using density functional theory and analyzed materials as potential silicon alternatives for semiconductors."},"0:memories":{"title":"A lot of different hats","body":"Varsity football quarterback and captain. Head varsity basketball manager. AAPI Club president. Head school tour administrator. Sustainable Fashion Club president. Environment Club vice president. Flag football offensive coordinator.\n\nThese are some of the communities and roles that filled my years at Science Academy. More memories to come."},"1:classes":{"title":"What I’m studying","body":"Duke University · Expected graduation: May 2029\n\nEconomics and political science (international relations), with a Markets & Management certificate. GPA: 3.7/4.0.\n\nThis is where I’ll add favorite classes, ideas, and academic projects."},"1:life":{"title":"Finding my people at Duke","body":"CreatorLab · Duke Sports Business Conference · Temptasians Acapella · KAjok · Club Golf · Ballislive · TEA @ Duke · Roundnet Club\n\nI’m also a Duke Athletics Communications Assistant, Sports Club Supervisor, and F2T Orientation Leader."},"1:future":{"title":"Creating at Duke","body":"At Duke TrueBlueTV, I direct and film sports content for underrepresented teams and student-athletes.\n\nAt CreatorLab, I’m a recruitment coordinator, co-class president, video creator, editor, and on-screen talent.\n\nSports, media, and community are a big part of the chapter I’m building here."}},"restaurant":{"intro":"A little clubhouse kitchen for cooking, latte art, and good company. Come on in.","favorites":"","memories":"ABOUT TIME CAFÉ\n\nI work as a barista and marketing strategist at About Time Café in Los Angeles. Along with late-night shifts, I created a Labubu-inspired marketing campaign that doubled sales within two months.","next":"A place for my Beli finds, recipes to try, and latte-art experiments. More to come."}};

function personalStrip(){const items=[['A competitive streak','Golf. Basketball. Football. Archery. Pick a game.',6,'<path d="M10 37V8m0 1 21 6-21 6M5 38h13"/><circle cx="34" cy="36" r="4"/>'],['Always making something','A camera, an idea, and one more edit.',3,'<rect x="4" y="14" width="36" height="25" rx="5"/><path d="m13 14 3-6h12l3 6"/><circle cx="22" cy="26" r="8"/>'],['Coffee is a craft','Café shifts, latte art, and a place to catch up.',2,'<path d="M7 17h25v11a12 12 0 0 1-25 0Z M32 19h3a6 6 0 0 1 0 12h-3 M7 42h26 M15 5v6 M24 3v8"/>'],['Room for others','Dream Tree, teaching, and showing up.',4,'<path d="M22 42V24m0 9-9-8m9 4 10-10"/><path d="M10 27C-2 24 3 10 12 12 10-2 33-2 32 12c13-2 15 18 2 19"/>']];return `<section class="personal-strip" aria-label="A few things about Boaz"><div><h2>Off the scorecard.</h2><p class="hand-note">A few things that make me, me.</p></div><div class="bag-grid">${items.map(([title,copy,i,art])=>`<button class="bag-card" data-route="hole-${i+1}"><span class="bag-arrow" aria-hidden="true">↗</span><svg viewBox="0 0 46 48" fill="none" stroke="currentColor" aria-hidden="true">${art}</svg><b>${title}</b><small>${copy}</small></button>`).join('')}</div></section>`}
function clubhouse(){return `<div class="intro"><span class="eyebrow"><span class="dot"></span>WELCOME TO ${state.profile.name?escape(state.profile.name.toUpperCase())+'’S':'MY'} LITTLE CORNER OF THE GREEN</span><p>No tee time required.</p></div><section class="hero"><div class="hero-copy"><span class="eyebrow">HEY, I’M BOAZ · WELCOME IN</span><h1>A little about me.<br><em>One hole<br>at a time.</em></h1><p>${escape(state.profile.intro)}</p><div class="hero-actions"><button class="primary" data-route="hole-1">Head to the first tee <span aria-hidden="true">↗</span></button><button class="text-button" data-route="course">Explore the course <span aria-hidden="true">→</span></button></div><div class="mini-rule"></div><p class="hand-note">Economics at Duke. A camera in my bag.<br>Probably thinking about my next meal.</p></div>${map()}</section>${personalStrip()}<div class="below-heading"><h2>Make yourself at home.</h2><span class="eyebrow">AROUND THE CLUBHOUSE</span></div><section class="hub-grid" aria-label="Inside the clubhouse"><button class="hub-card restaurant" data-route="restaurant">${bowl}<div><span class="eyebrow">INSIDE THE CLUBHOUSE</span><h3>The Lucky Ninth</h3><p>My Asian kitchen. Come for the food, stay for the stories.</p></div><span class="arrow" aria-hidden="true">↗</span></button><button class="hub-card" data-route="scorecard">${scoreIcon}<div><span class="eyebrow">THE BIG PICTURE</span><h3>My scorecard</h3><p>A quick look at every chapter on the course.</p></div><span class="arrow" aria-hidden="true">↗</span></button></section>`}
function course(){return `<div class="page-heading"><span class="eyebrow">NINE HOLES. ONE PERSONAL STORY.</span><h1>Choose your own round.</h1><p>Start at the first tee or follow your curiosity. Every flag opens a different part of my life.</p></div><section class="course-layout">${map()}<div class="course-list" aria-label="All nine holes">${state.holes.map((h,i)=>`<button class="hole-row" data-route="hole-${i+1}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="row-name">${escape(h.title)}</span><small>${visited.has(i)?'VISITED':'EXPLORE'}</small><span aria-hidden="true">↗</span></button>`).join('')}</div></section>`}
function scorecard(){const built=state.holes.filter(h=>h.body.trim()).length;return `<div class="page-heading"><span class="eyebrow">A LIFE, STILL IN PLAY</span><h1>My scorecard.</h1><p>Experience, interests, and everything in between. Here’s the whole course at a glance.</p></div><div class="score-top"><span class="eyebrow">THE PERSONAL COUNTRY CLUB / FRONT NINE</span><p>${built} of 9 chapters filled in · ${visited.size} explored</p></div><table class="score-table"><thead><tr><th scope="col">HOLE</th><th scope="col">CHAPTER</th><th scope="col" class="score-purpose">ON THE COURSE</th><th scope="col">STATUS</th><th scope="col"><span aria-label="Open chapter">↗</span></th></tr></thead><tbody>${state.holes.map((h,i)=>`<tr><td>${String(i+1).padStart(2,'0')}</td><td class="section-name">${escape(h.title)}</td><td class="score-purpose">${escape(h.subtitle)}</td><td><span class="status">${h.body.trim()?'In play':'To be written'}</span></td><td><button data-route="hole-${i+1}" aria-label="Open ${escape(h.title)}">Open ↗</button></td></tr>`).join('')}</tbody></table>`}

function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state));return true}catch{return false}}
function field(name,label,value,multi=false,placeholder=''){return `<label class="field">${label}${multi?`<textarea name="${name}" rows="5" placeholder="${escape(placeholder)}" maxlength="20000">${escape(value)}</textarea>`:`<input name="${name}" value="${escape(value)}" placeholder="${escape(placeholder)}" maxlength="${name==='name'?35:80}">`}</label>`}
function edit(target,index){returnFocus=document.activeElement;editTarget=target==='hole'?Number(index):target;let fields='',title='';if(target==='spot'){editTarget='spot:'+selectedSpot.i+':'+selectedSpot.id;const spot=roomSpots[selectedSpot.i].find(s=>s.id===selectedSpot.id),note=state.spots[selectedSpot.i+':'+selectedSpot.id]||{};title=spot.label;fields=field('title','STORY TITLE',note.title||spot.label)+field('body','YOUR STORY',note.body||'',true,spot.prompt)}else if(target==='profile'){title='Your clubhouse';fields=field('name','YOUR NAME',state.profile.name,false,'Your name')+field('intro','A LITTLE INTRODUCTION',state.profile.intro,true)}else if(target==='restaurant'){title='The Lucky Ninth';fields=field('intro','WELCOME TO YOUR KITCHEN',state.restaurant.intro,true)+field('favorites','FAVORITE DISHES',state.restaurant.favorites,true,'What’s your usual order?')+field('memories','FOOD & STORIES',state.restaurant.memories,true,'A meal, a place, a memory…')+field('next','ON YOUR LIST',state.restaurant.next,true,'Where to next?')}else{const h=state.holes[editTarget];title='Hole '+(editTarget+1)+' · Your story';fields=field('title','CHAPTER NAME',h.title)+field('subtitle','A SHORT TAGLINE',h.subtitle)+field('body','YOUR STORY',h.body,true,h.prompt)}$('#dialogTitle').textContent=title;$('#formFields').innerHTML=fields;$('#editDialog').showModal()}
function download(){const exportState={...state,instance:state.instance||String(Date.now())};const clone=document.documentElement.cloneNode(true);clone.querySelector('#site-data').textContent=JSON.stringify(exportState).replace(/</g,'\\u003c');clone.querySelector('#editDialog').removeAttribute('open');clone.querySelector('#objectDialog').removeAttribute('open');clone.querySelector('#toast').hidden=true;clone.querySelector('#formFields').innerHTML='';clone.querySelector('#teeIntro')?.remove();clone.querySelector('#teeSpacer')?.remove();clone.querySelector('.shell')?.removeAttribute('inert');const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='boazyoo.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Downloaded with your latest stories included.')}
document.addEventListener('click',e=>{const route=e.target.closest('[data-route]');if(route){go(route.dataset.route);return}const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case'scene-object':interactWith(Number(action.dataset.index),action.dataset.spot);break;case'close-object':$('#objectDialog').close();break;case'edit-spot':$('#objectDialog').close();if(selectedSpot?.id==='chapter')edit('hole',selectedSpot.i);else edit('spot');break;case'edit-profile':edit('profile');break;case'edit-hole':edit('hole',action.dataset.index);break;case'edit-restaurant':edit('restaurant');break;case'close-dialog':$('#editDialog').close();break;case'download':download();break;case'replay-intro':startIntro(true);break}});
$('#editForm').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));Object.keys(data).forEach(k=>data[k]=data[k].trim());if(typeof editTarget==='number'){if(!data.title){toast('Give this chapter a name before saving.');e.currentTarget.elements.title.focus();return}state.holes[editTarget]={...state.holes[editTarget],...data}}else if(editTarget.startsWith('spot:'))state.spots[editTarget.slice(5)]=data;else state[editTarget]={...state[editTarget],...data};const saved=persist();$('#editDialog').close();render();toast(saved?'Saved. Your course is taking shape.':'Updated for this visit. Download to keep your changes.');if(returnFocus?.isConnected)returnFocus.focus()});
$('#editDialog').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
window.addEventListener('hashchange',()=>render(true));render();if(typeof window.matchMedia==='function')startIntro();
})();
</script>
